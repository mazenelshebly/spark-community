<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPARK | Discover What's Next</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0A0A0A;
      color: #F7F4EB;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .small {
      color: #7BE8F6;
      font-size: 13px;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 100px);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 25px;
    }

    h1 span {
      color: #FF5A2A;
    }

    p {
      color: #aaa;
      font-size: 18px;
      line-height: 1.6;
      max-width: 600px;
      margin: auto;
    }

    .line {
      width: 70px;
      height: 3px;
      background: #7BE8F6;
      margin: 35px auto;
    }

    .message {
      font-size: 14px;
      letter-spacing: 3px;
      color: #F7F4EB;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="small">BENHA UNIVERSITY COMMUNITY</div>

    <h1>
      WHAT'S<br>
      <span>NEXT?</span>
    </h1>

    <div class="line"></div>

    <p>
      Eight tracks.<br>
      Eight challenges.<br>
      One hidden message.
    </p>

    <br><br>

    <div class="message">
      DISCOVER IT.
    </div>

  </div>

</body>
</html>
