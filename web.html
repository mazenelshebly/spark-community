<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>WEB DEVELOPMENT | SPARK</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0A0A0A;
      color: #F7F4EB;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 700px;
      text-align: center;

      position: relative;
      z-index: 30;
    }

    .track {
      color: #7BE8F6;
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(35px, 8vw, 65px);
      margin-bottom: 20px;
    }

    .question {
      color: #aaa;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 18px;

      background: #111;
      color: #F7F4EB;

      border: 1px solid #333;
      border-radius: 8px;

      font-size: 16px;
      cursor: pointer;

      transition: 0.2s ease;
    }

    button:hover {
      border-color: #7BE8F6;
    }

    button:disabled {
      cursor: default;
    }

    #result {
      margin-top: 30px;
      font-size: 18px;
      line-height: 1.6;
    }

    .correct {
      color: #7BE8F6;
    }

    .wrong {
      color: #FF5A2A;
    }

    .clue {
      margin-top: 15px;
      font-size: 30px;
      font-weight: bold;
      color: #FF5A2A;
      letter-spacing: 3px;
    }


    /* ================================
       SPARK CHARACTER
    ================================ */

    #spark-stage {
      position: fixed;

      right: 6vw;
      bottom: 4vh;

      width: 190px;
      height: 240px;

      z-index: 20;
      pointer-events: none;
    }

    #spark-character {
      position: absolute;

      width: 100%;
      height: 100%;

      object-fit: contain;

      filter:
        drop-shadow(0 0 12px rgba(123, 232, 246, 0.25));

      transform-origin: center bottom;

      animation: sparkIdle 3s ease-in-out infinite;
    }

    #spark-glow {
      position: absolute;

      width: 130px;
      height: 130px;

      left: 30px;
      bottom: 15px;

      border-radius: 50%;

      background: rgba(123, 232, 246, 0.13);

      filter: blur(35px);

      animation: sparkGlow 2.5s ease-in-out infinite;
    }


    /* ================================
       SPARK CANVAS
    ================================ */

    #spark-canvas {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 10;
    }


    /* ================================
       ANIMATIONS
    ================================ */

    @keyframes sparkIdle {

      0%,
      100% {
        transform: translateY(0) rotate(-1deg);
      }

      50% {
        transform: translateY(-10px) rotate(1deg);
      }

    }

    @keyframes sparkGlow {

      0%,
      100% {
        transform: scale(0.8);
        opacity: 0.35;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.8;
      }

    }


    /* ================================
       MOBILE
    ================================ */

    @media (max-width: 700px) {

      #spark-stage {
        width: 110px;
        height: 145px;

        right: 10px;
        bottom: 10px;
      }

    }
  </style></head><body>  <!-- SPARK CHARACTER -->  <div id="spark-stage"><div id="spark-glow"></div>

<img
  id="spark-character"
  src="assets/spark-web.png"
  alt="SPARK Web Development"
>

  </div>  <!-- SPARK PARTICLES --><canvas id="spark-canvas"></canvas>

  <!-- MAIN CONTENT -->  <div class="box"><div class="track">
  TRACK 01 / WEB DEVELOPMENT
</div>

<h1>
  THE FIRST CLUE
</h1>

<div class="question">
  Which layer controls the structure of a webpage?
</div>

<div class="options">

  <button onclick="checkAnswer(this, false)">
    CSS
  </button>

  <button onclick="checkAnswer(this, true)">
    HTML
  </button>

  <button onclick="checkAnswer(this, false)">
    JavaScript
  </button>

  <button onclick="checkAnswer(this, false)">
    SQL
  </button>

</div>

<div id="result"></div>

  </div>  <script>

    /* =========================================
       ANSWER SYSTEM
    ========================================= */

    function checkAnswer(button, correct) {

      const result = document.getElementById("result");

      if (correct) {

        result.innerHTML = `
          <div class="correct">CORRECT.</div>
          <div>YOUR CLUE IS:</div>
          <div class="clue">BUILD</div>
        `;

        document.querySelectorAll("button").forEach(btn => {
          btn.disabled = true;
        });

      } else {

        result.innerHTML = `
          <div class="wrong">NOT THIS ONE.</div>
          <div>TRY AGAIN.</div>
        `;

      }

    }


    /* =========================================
       SPARK PARTICLE ENGINE
    ========================================= */

    const canvas = document.getElementById("spark-canvas");
    const ctx = canvas.getContext("2d");

    let width;
    let height;


    /* Canvas Size */

    function resizeSparkCanvas() {

      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;

    }

    resizeSparkCanvas();

    window.addEventListener("resize", resizeSparkCanvas);


    /* Mouse */

    const sparkMouse = {

      x: window.innerWidth / 2,
      y: window.innerHeight / 2

    };


    window.addEventListener("mousemove", function (event) {

      sparkMouse.x = event.clientX;
      sparkMouse.y = event.clientY;

    });


    /* Particles */

    const sparkParticles = [];

    const codeSymbols = [
      "</>",
      "{ }",
      "01",
      "[]",
      "&&",
      ";",
      "/>",
      "<>"
    ];


    for (let i = 0; i < 55; i++) {

      sparkParticles.push({

        x: Math.random() * width,
        y: Math.random() * height,

        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,

        size: Math.random() * 10 + 8,

        symbol:
          codeSymbols[
            Math.floor(
              Math.random() * codeSymbols.length
            )
          ],

        opacity:
          Math.random() * 0.35 + 0.05

      });

    }


    /* Animation */

    function animateSpark() {

      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      sparkParticles.forEach(p => {

        const dx =
          sparkMouse.x - p.x;

        const dy =
          sparkMouse.y - p.y;

        const distance =
          Math.sqrt(
            dx * dx +
            dy * dy
          );


        /* Mouse interaction */

        if (distance < 180) {

          p.x += dx * 0.001;
          p.y += dy * 0.001;

        }


        /* Movement */

        p.x += p.vx;
        p.y += p.vy;


        /* Screen wrapping */

        if (p.x < -50) {
          p.x = width + 50;
        }

        if (p.x > width + 50) {
          p.x = -50;
        }

        if (p.y < -50) {
          p.y = height + 50;
        }

        if (p.y > height + 50) {
          p.y = -50;
        }


        /* Draw */

        ctx.globalAlpha = p.opacity;

        ctx.font =
          `${p.size}px monospace`;

        ctx.fillStyle =
          "#7BE8F6";

        ctx.fillText(
          p.symbol,
          p.x,
          p.y
        );

      });


      ctx.globalAlpha = 1;

      requestAnimationFrame(
        animateSpark
      );

    }


    animateSpark();

  </script></body>
</html>
