<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WEB DEVELOPMENT | SPARK</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #0A0A0A;
    color: #F7F4EB;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    overflow: hidden;
}


/* =========================================
   MAIN CONTENT
========================================= */

.box {
    width: 100%;
    max-width: 700px;

    text-align: center;

    position: relative;
    z-index: 30;
}

.track {
    color: #7BE8F6;

    font-size: 13px;
    letter-spacing: 4px;

    margin-bottom: 25px;
}

h1 {
    font-size: clamp(35px, 8vw, 65px);

    margin-bottom: 20px;
}

.question {
    color: #aaa;

    font-size: 18px;
    line-height: 1.6;

    margin-bottom: 30px;
}

.options {
    display: grid;
    gap: 12px;
}

button {
    width: 100%;

    padding: 18px;

    background: #111;

    color: #F7F4EB;

    border: 1px solid #333;

    border-radius: 8px;

    font-size: 16px;

    cursor: pointer;

    transition:
        border-color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
}

button:hover {
    border-color: #7BE8F6;

    transform: translateY(-2px);

    box-shadow:
        0 0 15px rgba(123,232,246,.15);
}

button:disabled {
    cursor: default;
    transform: none;
}

#result {
    margin-top: 30px;

    font-size: 18px;
    line-height: 1.6;

    min-height: 80px;
}

.correct {
    color: #7BE8F6;
}

.wrong {
    color: #FF5A2A;
}


/* =========================================
   BUILD CLUE
========================================= */

.clue {
    display: inline-block;

    position: relative;

    margin-top: 15px;

    padding: 8px 24px;

    min-width: 150px;

    background: #071A3D;

    color: #FFFFFF;

    border: 1px solid #FFFFFF;

    border-radius: 6px;

    font-size: 30px;

    font-weight: 900;

    letter-spacing: 5px;

    -webkit-text-stroke: .6px #FFFFFF;

    text-shadow:
        0 0 4px #FFFFFF,
        0 0 9px #FFFFFF,
        0 0 18px #7BE8F6,
        0 0 30px rgba(123,232,246,.8);

    box-shadow:
        0 0 4px #FFFFFF,
        0 0 10px #FFFFFF,
        0 0 20px rgba(123,232,246,.7),
        inset 0 0 12px rgba(123,232,246,.22);

    animation:
        buildReveal .8s cubic-bezier(.2,.8,.2,1) both,
        buildPulse 2s ease-in-out .8s infinite;
}

.clue::after {
    content: "";

    position: absolute;

    left: 15%;
    right: 15%;

    bottom: -5px;

    height: 1px;

    background: #FFFFFF;

    box-shadow:
        0 0 5px #FFFFFF,
        0 0 12px #7BE8F6;

    opacity: .9;
}

@keyframes buildReveal {

    0% {
        opacity: 0;

        transform:
            scale(.55)
            translateY(12px);

        filter: blur(12px);
    }

    45% {
        opacity: 1;

        transform:
            scale(1.12)
            translateY(0);

        filter: blur(0);
    }

    70% {
        transform: scale(.96);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes buildPulse {

    0%,100% {
        box-shadow:
            0 0 4px #FFFFFF,
            0 0 10px #FFFFFF,
            0 0 20px rgba(123,232,246,.7),
            inset 0 0 12px rgba(123,232,246,.22);
    }

    50% {
        box-shadow:
            0 0 7px #FFFFFF,
            0 0 18px #FFFFFF,
            0 0 35px rgba(123,232,246,.95),
            inset 0 0 20px rgba(123,232,246,.35);
    }
}


/* =========================================
   NORMAL SPARK
========================================= */

#spark-stage {
    position: fixed;

    right: 6vw;
    bottom: 4vh;

    width: 190px;
    height: 240px;

    z-index: 20;

    pointer-events: none;
}

#spark-character {
    position: absolute;

    width: 100%;
    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 12px
            rgba(123,232,246,.25)
        );

    transform-origin: center bottom;

    animation:
        sparkIdle 3s ease-in-out infinite;
}

#spark-glow {
    position: absolute;

    width: 130px;
    height: 130px;

    left: 30px;
    bottom: 15px;

    border-radius: 50%;

    background:
        rgba(123,232,246,.13);

    filter: blur(35px);

    animation:
        sparkGlow 2.5s ease-in-out infinite;
}

@keyframes sparkIdle {

    0%,100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(1deg);
    }
}

@keyframes sparkGlow {

    0%,100% {
        transform: scale(.8);
        opacity: .35;
    }

    50% {
        transform: scale(1.15);
        opacity: .8;
    }
}


/* =========================================
   REACTION LAYER
========================================= */

#reaction-layer {
    position: fixed;

    inset: 0;

    z-index: 50;

    pointer-events: none;

    display: none;

    align-items: center;
    justify-content: center;
}

#reaction-layer.active {
    display: flex;
}

#reaction-spark {
    width: 230px;
    height: 230px;

    object-fit: contain;

    position: relative;

    z-index: 3;

    filter:
        drop-shadow(0 0 20px rgba(123,232,246,.7));
}


/* =========================================
   HAPPY REACTION
========================================= */

#reaction-layer.happy #reaction-spark {

    animation:
        happySpark 5s ease-in-out forwards;
}

@keyframes happySpark {

    0% {
        opacity: 0;

        transform:
            scale(.15)
            translateY(40px);

        filter:
            drop-shadow(0 0 0 transparent);
    }

    15% {
        opacity: 1;

        transform:
            scale(1.15)
            translateY(0);

        filter:
            drop-shadow(0 0 35px rgba(123,232,246,.9));
    }

    25% {
        transform:
            scale(.95)
            translateY(-10px);
    }

    40% {
        transform:
            scale(1.05)
            translateY(0);
    }

    75% {
        opacity: 1;

        transform:
            scale(1)
            translateY(-5px);
    }

    100% {
        opacity: 0;

        transform:
            scale(.85)
            translateY(-30px);
    }
}


/* =========================================
   ANGRY REACTION
========================================= */

#reaction-layer.angry #reaction-spark {

    animation:
        angrySpark 5s ease-in-out forwards;

    filter:
        drop-shadow(0 0 30px rgba(255,70,30,.9));
}

@keyframes angrySpark {

    0% {
        opacity: 0;

        transform:
            scale(.15)
            translateY(40px);
    }

    12% {
        opacity: 1;

        transform:
            scale(1.15)
            translateY(0);
    }

    20% {
        transform:
            scale(.95)
            rotate(-7deg);
    }

    28% {
        transform:
            scale(1)
            rotate(7deg);
    }

    36% {
        transform:
            scale(1)
            rotate(-5deg);
    }

    50% {
        transform:
            scale(1.03)
            rotate(4deg);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            scale(.85)
            translateY(-25px);
    }
}


/* =========================================
   REACTION PARTICLES
========================================= */

.reaction-particle {
    position: absolute;

    font-size: 30px;

    opacity: 0;

    animation:
        reactionParticle 4s ease-out forwards;
}

@keyframes reactionParticle {

    0% {
        opacity: 0;

        transform:
            translate(0,0)
            scale(.2);
    }

    15% {
        opacity: 1;
    }

    60% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(var(--x),var(--y))
            scale(1.3)
            rotate(var(--r));
    }
}


/* =========================================
   CODE PARTICLES CANVAS
========================================= */

#spark-canvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;
}


/* =========================================
   SCREEN FLASH
========================================= */

#screen-flash {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 40;

    opacity: 0;
}

#screen-flash.error {

    background:
        rgba(255,60,40,.14);

    animation:
        errorFlash .45s ease-out;
}

@keyframes errorFlash {

    0% {
        opacity: 0;
    }

    30% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width:700px) {

    #spark-stage {

        width: 110px;
        height: 145px;

        right: 10px;
        bottom: 10px;
    }

    #reaction-spark {

        width: 190px;
        height: 190px;
    }

    .clue {

        font-size: 25px;

        padding:
            7px 18px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     NORMAL SPARK
========================================= -->

<div id="spark-stage">

    <div id="spark-glow"></div>

    <img
        id="spark-character"
        src="assets/spark-web.png"
        alt="SPARK Web Development"
    >

</div>


<!-- =========================================
     CODE PARTICLES
========================================= -->

<canvas id="spark-canvas"></canvas>


<!-- =========================================
     ERROR FLASH
========================================= -->

<div id="screen-flash"></div>


<!-- =========================================
     REACTION SPARK
========================================= -->

<div id="reaction-layer">

    <img
        id="reaction-spark"
        src=""
        alt="Spark Reaction"
    >

</div>


<!-- =========================================
     QUESTION
========================================= -->

<div class="box">

    <div class="track">
        TRACK 01 / WEB DEVELOPMENT
    </div>


    <h1>
        THE FIRST CLUE
    </h1>


    <div class="question">
        Which layer controls the structure of a webpage?
    </div>


    <div class="options">

        <button onclick="checkAnswer(this, false)">
            CSS
        </button>

        <button onclick="checkAnswer(this, true)">
            HTML
        </button>

        <button onclick="checkAnswer(this, false)">
            JavaScript
        </button>

        <button onclick="checkAnswer(this, false)">
            SQL
        </button>

    </div>


    <div id="result"></div>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const canvas =
    document.getElementById("spark-canvas");

const ctx =
    canvas.getContext("2d");

const result =
    document.getElementById("result");

const screenFlash =
    document.getElementById("screen-flash");

const reactionLayer =
    document.getElementById("reaction-layer");

const reactionSpark =
    document.getElementById("reaction-spark");


/* =========================================
   CANVAS SIZE
========================================= */

let width =
    window.innerWidth;

let height =
    window.innerHeight;


function resizeCanvas() {

    const dpr =
        window.devicePixelRatio || 1;

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================
   MOUSE
========================================= */

const sparkMouse = {

    x: width / 2,

    y: height / 2
};


window.addEventListener(
    "mousemove",
    function(event) {

        sparkMouse.x =
            event.clientX;

        sparkMouse.y =
            event.clientY;

    }
);


/* =========================================
   CODE SYMBOLS
========================================= */

const codeSymbols = [

    "</>",
    "{ }",
    "01",
    "[]",
    "&&",
    ";",
    "/>",
    "<>",
    "HTML",
    "CSS",
    "JS"

];


/* =========================================
   PARTICLES
========================================= */

const sparkParticles = [];


for (let i = 0; i < 90; i++) {

    sparkParticles.push({

        x:
            Math.random() * width,

        y:
            Math.random() * height,

        vx:
            (Math.random() - 0.5) * 0.35,

        vy:
            (Math.random() - 0.5) * 0.35,

        size:
            Math.random() * 10 + 9,

        symbol:
            codeSymbols[
                Math.floor(
                    Math.random() *
                    codeSymbols.length
                )
            ],

        opacity:
            Math.random() * 0.35 + 0.15,

        baseOpacity:
            Math.random() * 0.35 + 0.15,

        color:
            "#7BE8F6"

    });

}


/* =========================================
   PARTICLE COLOR
========================================= */

function setParticlesColor(color) {

    sparkParticles.forEach(function(p) {

        p.color = color;

    });

}


/* =========================================
   RESET PARTICLES
========================================= */

function resetParticles() {

    sparkParticles.forEach(function(p) {

        p.color =
            "#7BE8F6";

        p.opacity =
            p.baseOpacity;

    });

}


/* =========================================
   HAPPY PARTICLES
========================================= */

function happyParticles() {

    setParticlesColor("#7BE8F6");

    sparkParticles.forEach(function(p, index) {

        const angle =
            (index /
            sparkParticles.length) *
            Math.PI * 2;

        const radius =
            120 +
            Math.random() * 180;

        p.targetX =
            width / 2 +
            Math.cos(angle) * radius;

        p.targetY =
            height / 2 +
            Math.sin(angle) * radius;

        p.opacity =
            0.9;

    });


    setTimeout(function() {

        resetParticles();

    }, 1500);

}


/* =========================================
   WRONG PARTICLES
========================================= */

function wrongParticles() {

    setParticlesColor("#FF5A2A");

    sparkParticles.forEach(function(p) {

        p.opacity =
            Math.min(
                p.baseOpacity + 0.45,
                1
            );

    });


    screenFlash.classList.remove("error");

    void screenFlash.offsetWidth;

    screenFlash.classList.add("error");


    setTimeout(function() {

        resetParticles();

    }, 900);

}


/* =========================================
   REACTION PARTICLES
========================================= */

function createReactionParticles(type) {

    reactionLayer
        .querySelectorAll(".reaction-particle")
        .forEach(function(p) {

            p.remove();

        });


    const symbols =
        type === "happy"

        ? ["♥", "♥", "♥", "✦", "♥", "✦"]

        : ["🔥", "🔥", "🔥", "💥", "🔥", "💥"];


    for (let i = 0; i < 14; i++) {

        const particle =
            document.createElement("div");

        particle.className =
            "reaction-particle";

        particle.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        const angle =
            Math.random() *
            Math.PI * 2;

        const distance =
            120 +
            Math.random() * 180;


        const x =
            Math.cos(angle) * distance;

        const y =
            Math.sin(angle) * distance;


        particle.style.left =
            "50%";

        particle.style.top =
            "50%";


        particle.style.setProperty(
            "--x",
            x + "px"
        );

        particle.style.setProperty(
            "--y",
            y + "px"
        );

        particle.style.setProperty(
            "--r",
            (Math.random() * 90 - 45) + "deg"
        );


        particle.style.animationDelay =
            (Math.random() * 0.4) + "s";


        reactionLayer.appendChild(
            particle
        );

    }

}


/* =========================================
   SHOW HAPPY SPARK
========================================= */

function showHappySpark() {

    reactionLayer.className = "";

    reactionLayer.classList.add(
        "active",
        "happy"
    );

    reactionSpark.src =
        "assets/spark-happy.png";


    createReactionParticles("happy");


    setTimeout(function() {

        reactionLayer.className = "";

        reactionSpark.src = "";

        reactionLayer
            .querySelectorAll(".reaction-particle")
            .forEach(function(p) {

                p.remove();

            });

    }, 5000);

}


/* =========================================
   SHOW ANGRY SPARK
========================================= */

function showAngrySpark() {

    reactionLayer.className = "";

    reactionLayer.classList.add(
        "active",
        "angry"
    );

    reactionSpark.src =
        "spark-angry.png";


    createReactionParticles("angry");


    setTimeout(function() {

        reactionLayer.className = "";

        reactionSpark.src = "";

        reactionLayer
            .querySelectorAll(".reaction-particle")
            .forEach(function(p) {

                p.remove();

            });

    }, 5000);

}


/* =========================================
   ANSWER SYSTEM
========================================= */

let answeredCorrectly = false;


function checkAnswer(button, correct) {

    if (answeredCorrectly) {
        return;
    }


    if (correct) {

        answeredCorrectly = true;


        happyParticles();

        showHappySpark();


        result.innerHTML = `

            <div class="correct">
                CORRECT.
            </div>

            <div>
                YOUR CLUE IS:
            </div>

            <div class="clue">
                BUILD
            </div>

        `;


        document
            .querySelectorAll(".options button")
            .forEach(function(btn) {

                btn.disabled = true;

            });


    } else {

        wrongParticles();

        showAngrySpark();


        result.innerHTML = `

            <div class="wrong">
                NOT THIS ONE.
            </div>

            <div>
                TRY AGAIN.
            </div>

        `;

    }

}

        if (p.y < -80) {

            p.y =
                height + 80;

        }


        if (p.y > height + 80) {

            p.y = -80;

        }
