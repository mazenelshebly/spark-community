<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Thank You</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    background: #050A12;

    color: #F5FAFF;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

}

.container {

    padding: 30px;

}

h1 {

    font-size:
        clamp(55px, 12vw, 140px);

    line-height: .9;

    font-weight: 900;

    letter-spacing: -5px;

    background:

        linear-gradient(
            90deg,
            #F5FAFF,
            #55B7FF
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

}

p {

    margin-top: 25px;

    color: #9BAEC2;

    font-size: 13px;

    letter-spacing: 3px;

    text-transform: uppercase;

}

</style>

</head>

<body>

<div class="container">

    <h1>
        THANK YOU
    </h1>

    <p>
        THANK YOU FOR BEING PART OF THE COMMUNITY.
    </p>

</div>

</body>

</html>
