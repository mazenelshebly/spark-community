<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPARK — QR Challenge Board</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050A12;
  color:#F5FAFF;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  width:210mm;
  min-height:297mm;
  margin:auto;
  padding:10mm;
}

header{
  text-align:center;
  margin-bottom:7mm;
}

h1{
  margin:0;
  font-size:28px;
  letter-spacing:3px;
}

.subtitle{
  margin-top:7px;
  color:#9BAEC2;
  font-size:12px;
}

.board{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6mm;
}

.card{
  background:#081525;
  border:1px solid rgba(141,219,255,.16);
  border-radius:12px;
  padding:5mm;
  min-height:78mm;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}

.track-number{
  color:#55B7FF;
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
}

.track-name{
  margin-top:4px;
  font-size:17px;
  font-weight:800;
  letter-spacing:.7px;
}

.track-qr{
  background:#fff;
  padding:7px;
  margin:4mm 0 3mm;
  border-radius:5px;
}

.track-qr canvas,
.track-qr img{
  display:block;
}

.instruction{
  color:#9BAEC2;
  font-size:9px;
  line-height:1.45;
}

.final-status{
  width:100%;
  margin-top:4mm;
  padding-top:3mm;

  border-top:1px dashed rgba(141,219,255,.25);

  color:#8DDBFF;

  font-size:9px;
  font-weight:bold;
  letter-spacing:1px;
  line-height:1.5;
}


/* =====================================
   FINAL UNLOCK CARD
===================================== */

.final-card{
  grid-column:1 / -1;

  background:
    linear-gradient(
      145deg,
      #0b1830,
      #101020
    );

  border:1px solid rgba(123,232,246,.35);

  min-height:88mm;

  margin-top:1mm;

  box-shadow:
    0 0 30px rgba(123,232,246,.07);
}

.final-card .track-number{
  color:#C084FC;
}

.final-card .track-name{
  font-size:22px;
  letter-spacing:1.5px;
}

.final-card .track-qr{
  margin:5mm 0 3mm;
}

.final-instruction{
  color:#9BAEC2;
  font-size:10px;
  line-height:1.6;
}

.final-highlight{
  margin-top:4mm;

  color:#7BE8F6;

  font-size:10px;

  font-weight:bold;

  letter-spacing:1.5px;
}


.print-button{
  display:block;

  margin:12px auto;

  padding:12px 24px;

  border:0;

  border-radius:8px;

  background:#1687FF;

  color:white;

  font-weight:bold;

  cursor:pointer;
}


@media print{

  body{
    background:white;
  }

  .page{
    margin:0;
  }

  .print-button{
    display:none;
  }

  .card{
    break-inside:avoid;
  }

}

</style>
</head>


<body>


<button
  class="print-button"
  onclick="window.print()"
>
  PRINT / SAVE PDF
</button>


<div class="page">


<header>

  <h1>
    SPARK
  </h1>

  <div class="subtitle">
    8 Tracks · 8 Challenges · 8 Final Codes · Final Unlock
  </div>

</header>


<div
  class="board"
  id="board"
></div>


</div>



<script>


/*
==================================================
BASE URL
==================================================
*/

const BASE_URL =
"https://mazenelshebly.github.io/spark-community/";



/*
==================================================
TRACKS
==================================================

All 8 tracks participate
in the Final Unlock.

Each QR opens its own challenge.
*/

const tracks = [

  {
    id:"web",
    name:"WEB DEVELOPMENT",
    file:"web.html"
  },

  {
    id:"data",
    name:"DATA ANALYSIS",
    file:"data.html"
  },

  {
    id:"cyber",
    name:"CYBER SECURITY",
    file:"cyber.html"
  },

  {
    id:"bioinformatics",
    name:"BIOINFORMATICS",
    file:"bioinformatics.html"
  },

  {
    id:"marketing",
    name:"MARKETING",
    file:"marketing.html"
  },

  {
    id:"hr",
    name:"HUMAN RESOURCES",
    file:"hr.html"
  },

  {
    id:"logistics",
    name:"LOGISTICS",
    file:"logistics.html"
  },

  {
    id:"general-skills",
    name:"GENERAL SKILLS",
    file:"general-skills.html"
  }

];



/*
==================================================
CREATE TRACK CARDS
==================================================
*/

const board =
document.getElementById("board");


tracks.forEach(
  (track,index)=>{

    const card =
    document.createElement("div");


    card.className =
      "card";


    const number =
      String(index+1)
      .padStart(2,"0");


    const trackUrl =
      BASE_URL + track.file;


    card.innerHTML = `

      <div class="track-number">
        TRACK ${number}
      </div>

      <div class="track-name">
        ${track.name}
      </div>

      <div
        class="track-qr"
        id="qr-${track.id}">
      </div>

      <div class="instruction">

        SCAN THIS QR<br>
        OPEN THE CHALLENGE<br>
        SOLVE IT

      </div>

      <div class="final-status">

        COMPLETE THE TRACK<br>
        RECEIVE YOUR FINAL CODE

      </div>

    `;


    board.appendChild(card);


    /*
    Generate Track QR
    */

    new QRCode(

      document.getElementById(
        `qr-${track.id}`
      ),

      {

        text:trackUrl,

        width:145,
        height:145,

        colorDark:"#000000",
        colorLight:"#ffffff",

        correctLevel:
          QRCode.CorrectLevel.H

      }

    );

  }
);



/*
==================================================
FINAL UNLOCK QR
==================================================

This QR does NOT unlock the final by itself.

It only opens:

final-unlock.html

The student must then enter
the 8 Final Codes.
==================================================
*/


const finalUnlockUrl =
BASE_URL + "final-unlock.html";


const finalCard =
document.createElement("div");


finalCard.className =
  "card final-card";


finalCard.innerHTML = `

  <div class="track-number">
    FINAL ACCESS
  </div>

  <div class="track-name">
    FINAL UNLOCK
  </div>

  <div
    class="track-qr"
    id="qr-final-unlock">
  </div>

  <div class="final-instruction">

    SCAN THIS QR TO OPEN<br>
    THE FINAL UNLOCK SYSTEM

  </div>

  <div class="final-highlight">

    ENTER ALL 8 FINAL CODES

  </div>

`;


board.appendChild(
  finalCard
);



/*
==================================================
GENERATE FINAL UNLOCK QR
==================================================
*/

new QRCode(

  document.getElementById(
    "qr-final-unlock"
  ),

  {

    text:
      finalUnlockUrl,

    width:180,
    height:180,

    colorDark:"#000000",
    colorLight:"#ffffff",

    correctLevel:
      QRCode.CorrectLevel.H

  }

);


</script>

</body>
</html>
