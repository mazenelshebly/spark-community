<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPARK — Six-Piece QR Puzzle</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#0b1018;
    color:#f5faff;
    font-family:Arial,Helvetica,sans-serif;
}


/* =========================================
   CONTROL BAR
========================================= */

.controls{
    width:100%;
    padding:16px 24px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:#050a12;

    border-bottom:
        1px solid rgba(85,183,255,.20);
}

.title{
    font-size:16px;
    font-weight:900;

    letter-spacing:2px;
}

.subtitle{
    margin-top:5px;

    color:#8fa5ba;

    font-size:11px;
}

.print-btn{
    border:0;

    border-radius:8px;

    padding:12px 20px;

    background:#1687ff;

    color:white;

    font-weight:900;

    letter-spacing:1px;

    cursor:pointer;
}

.print-btn:hover{
    background:#55b7ff;
}


/* =========================================
   A4 SHEET
========================================= */

.sheet{

    width:210mm;
    height:297mm;

    margin:20px auto;

    padding:7mm;

    background:#050a12;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    grid-template-rows:
        repeat(2,1fr);

    gap:3mm;
}


/* =========================================
   CARD
========================================= */

.card{

    position:relative;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(22,135,255,.16),
            transparent 55%
        ),
        #081525;

    border:
        1px solid rgba(85,183,255,.30);

    border-radius:4px;

    padding:4mm;

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow:hidden;
}


/* =========================================
   CORNERS
========================================= */

.corner{

    position:absolute;

    width:4mm;
    height:4mm;

    border-color:#55b7ff;
}

.c1{

    top:1.5mm;
    right:1.5mm;

    border-top:1px solid;
    border-right:1px solid;
}

.c2{

    bottom:1.5mm;
    left:1.5mm;

    border-bottom:1px solid;
    border-left:1px solid;
}


/* =========================================
   HEADER
========================================= */

.number{

    align-self:flex-start;

    color:#55b7ff;

    font-size:7px;

    font-weight:900;

    letter-spacing:2px;
}

.track{

    margin-top:1.5mm;

    font-size:10px;

    font-weight:900;

    letter-spacing:.8px;

    text-align:center;
}

.type{

    margin-top:1mm;

    color:#8fa5ba;

    font-size:5px;

    letter-spacing:1.2px;
}


/* =========================================
   TRACK QR
========================================= */

.track-label{

    margin-top:3.5mm;

    color:#55b7ff;

    font-size:5px;

    font-weight:900;

    letter-spacing:1px;

    text-align:center;
}

.track-qr{

    width:32mm;
    height:32mm;

    margin-top:1.5mm;

    padding:1.5mm;

    background:#ffffff;

    display:flex;

    justify-content:center;

    align-items:center;
}

.track-qr canvas,
.track-qr img{

    width:100% !important;
    height:100% !important;

    display:block;
}


/* =========================================
   DIVIDER
========================================= */

.divider{

    width:85%;

    height:1px;

    margin-top:3mm;

    background:
        rgba(141,219,255,.18);
}


/* =========================================
   FINAL PIECE AREA
========================================= */

.piece-title{

    margin-top:2.5mm;

    color:#55b7ff;

    font-size:5px;

    font-weight:900;

    letter-spacing:1px;

    text-align:center;
}

.piece-wrap{

    position:relative;

    width:34mm;
    height:34mm;

    margin-top:1.5mm;

    padding:1.5mm;

    background:#ffffff;

    border:
        1.5px dashed #1687ff;

    display:flex;

    justify-content:center;

    align-items:center;
}

.piece-wrap canvas{

    width:100%;
    height:100%;

    display:block;
}


/* =========================================
   CUT LABEL
========================================= */

.cut-label{

    position:absolute;

    right:-1px;
    bottom:-1px;

    padding:
        1mm
        1.5mm;

    background:#1687ff;

    color:#ffffff;

    font-size:4px;

    font-weight:900;

    letter-spacing:.8px;
}


/* =========================================
   INSTRUCTIONS
========================================= */

.instruction{

    margin-top:1.5mm;

    color:#f5faff;

    font-size:4.8px;

    font-weight:900;

    letter-spacing:.7px;

    text-align:center;
}

.sub-instruction{

    margin-top:.8mm;

    color:#8fa5ba;

    font-size:4.3px;

    letter-spacing:.5px;

    text-align:center;
}


/* =========================================
   PRINT
========================================= */

@media print{

    @page{

        size:A4 portrait;

        margin:0;
    }

    body{

        background:white;
    }

    .controls{

        display:none;
    }

    .sheet{

        width:210mm;
        height:297mm;

        margin:0;

        padding:7mm;

        background:#050a12;
    }

    .card{

        break-inside:avoid;
    }
}


/* =========================================
   MOBILE
========================================= */

@media screen and (max-width:800px){

    .controls{

        flex-direction:column;

        align-items:flex-start;

        gap:12px;
    }

    .sheet{

        transform-origin:
            top center;

        margin-left:50%;

        transform:
            translateX(-50%)
            scale(.65);

        margin-top:20px;

        margin-bottom:-100px;
    }
}

</style>

</head>


<body>


<!-- =========================================
     CONTROL BAR
========================================= -->

<div class="controls">

    <div>

        <div class="title">
            SPARK — SIX-PIECE QR PUZZLE
        </div>

        <div class="subtitle">
            6 Tracks · 6 Challenges · 6 Puzzle Pieces · 1 Final QR
        </div>

    </div>

    <button
        class="print-btn"
        onclick="window.print()">

        PRINT / SAVE PDF

    </button>

</div>



<!-- =========================================
     SHEET
========================================= -->

<div
    class="sheet"
    id="sheet">
</div>



<script>


/* =========================================
   BASE URL
========================================= */

const BASE_URL =
"https://mazenelshebly.github.io/spark-community/";


/* =========================================
   FINAL URL
========================================= */

const FINAL_URL =
BASE_URL + "final-reveal.html";


/* =========================================
   SIX TRACKS
========================================= */

const tracks = [

    {
        number:"01",
        name:"WEB DEVELOPMENT",
        url:BASE_URL + "web.html"
    },

    {
        number:"02",
        name:"DATA ANALYSIS",
        url:BASE_URL + "data.html"
    },

    {
        number:"03",
        name:"CYBER SECURITY",
        url:BASE_URL + "cyber.html"
    },

    {
        number:"04",
        name:"BIOINFORMATICS",
        url:BASE_URL + "bioinformatics.html"
    },

    {
        number:"05",
        name:"HR",
        url:BASE_URL + "hr.html"
    },

    {
        number:"06",
        name:"LOGISTICS",
        url:BASE_URL + "logistics.html"
    }

];


/* =========================================
   HIDDEN FINAL QR GENERATOR
========================================= */

const generator =
document.createElement("div");

generator.style.position =
"absolute";

generator.style.left =
"-10000px";

generator.style.top =
"0";

generator.style.width =
"1200px";

generator.style.height =
"1200px";

document.body.appendChild(generator);


/* =========================================
   GENERATE FINAL QR
========================================= */

new QRCode(

    generator,

    {

        text:FINAL_URL,

        width:1200,

        height:1200,

        colorDark:"#000000",

        colorLight:"#ffffff",

        correctLevel:
            QRCode.CorrectLevel.H

    }

);


/* =========================================
   WAIT FOR FINAL QR
========================================= */

setTimeout(() => {


    const source =
        generator.querySelector("canvas");


    if(!source){

        console.error(
            "Final QR could not be generated."
        );

        return;
    }


    const sheet =
        document.getElementById("sheet");


    /* =====================================
       FINAL QR GRID

       3 columns × 2 rows

       01 02 03
       04 05 06
    ===================================== */

    const pieceSize =
        400;


    tracks.forEach(
        (track,index) => {


        /* =================================
           CARD
        ================================= */

        const card =
            document.createElement("div");

        card.className =
            "card";


        /* =================================
           CORNERS
        ================================= */

        const c1 =
            document.createElement("div");

        c1.className =
            "corner c1";


        const c2 =
            document.createElement("div");

        c2.className =
            "corner c2";


        /* =================================
           TRACK NUMBER
        ================================= */

        const number =
            document.createElement("div");

        number.className =
            "number";

        number.textContent =
            "TRACK " +
            track.number;


        /* =================================
           TRACK NAME
        ================================= */

        const trackName =
            document.createElement("div");

        trackName.className =
            "track";

        trackName.textContent =
            track.name;


        /* =================================
           TYPE
        ================================= */

        const type =
            document.createElement("div");

        type.className =
            "type";

        type.textContent =
            "TRACK CHALLENGE";


        /* =================================
           TRACK LABEL
        ================================= */

        const trackLabel =
            document.createElement("div");

        trackLabel.className =
            "track-label";

        trackLabel.textContent =
            "SCAN YOUR TRACK FIRST";


        /* =================================
           TRACK QR
        ================================= */

        const trackQR =
            document.createElement("div");

        trackQR.className =
            "track-qr";


        new QRCode(

            trackQR,

            {

                text:track.url,

                width:500,

                height:500,

                colorDark:"#000000",

                colorLight:"#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H

            }

        );


        /* =================================
           DIVIDER
        ================================= */

        const divider =
            document.createElement("div");

        divider.className =
            "divider";


        /* =================================
           PIECE TITLE
        ================================= */

        const pieceTitle =
            document.createElement("div");

        pieceTitle.className =
            "piece-title";

        pieceTitle.textContent =
            "FINAL QR PIECE " +
            track.number;


        /* =================================
           FINAL PIECE
        ================================= */

        const pieceWrap =
            document.createElement("div");

        pieceWrap.className =
            "piece-wrap";


        const pieceCanvas =
            document.createElement("canvas");

        pieceCanvas.width =
            pieceSize;

        pieceCanvas.height =
            pieceSize;


        const ctx =
            pieceCanvas.getContext("2d");


        /* =================================
           FINAL QR POSITION

           3 × 2
        ================================= */

        const column =
            index % 3;

        const row =
            Math.floor(index / 3);


        /* =================================
           CROP FINAL QR
        ================================= */

        ctx.drawImage(

            source,

            column * pieceSize,

            row * pieceSize,

            pieceSize,

            pieceSize,

            0,

            0,

            pieceSize,

            pieceSize

        );


        pieceWrap.appendChild(
            pieceCanvas
        );


        /* =================================
           CUT LABEL
        ================================= */

        const cutLabel =
            document.createElement("div");

        cutLabel.className =
            "cut-label";

        cutLabel.textContent =
            "CUT";


        pieceWrap.appendChild(
            cutLabel
        );


        /* =================================
           MAIN INSTRUCTION
        ================================= */

        const instruction =
            document.createElement("div");

        instruction.className =
            "instruction";

        instruction.textContent =
            "SCAN → SOLVE → CUT → ASSEMBLE";


        /* =================================
           SECOND INSTRUCTION
        ================================= */

        const subInstruction =
            document.createElement("div");

        subInstruction.className =
            "sub-instruction";

        subInstruction.textContent =
            "Keep your piece. Assemble 01 → 06.";


        /* =================================
           BUILD CARD
        ================================= */

        card.appendChild(c1);
        card.appendChild(c2);

        card.appendChild(number);

        card.appendChild(trackName);

        card.appendChild(type);

        card.appendChild(trackLabel);

        card.appendChild(trackQR);

        card.appendChild(divider);

        card.appendChild(pieceTitle);

        card.appendChild(pieceWrap);

        card.appendChild(instruction);

        card.appendChild(subInstruction);


        sheet.appendChild(card);

    });


    /* =====================================
       REMOVE GENERATOR
    ===================================== */

    generator.remove();


},1000);


</script>

</body>
</html>
