<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK — QR Challenge Board</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050A12;
  color:#F5FAFF;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  width:210mm;
  min-height:297mm;
  margin:auto;
  padding:10mm;
}

header{
  text-align:center;
  margin-bottom:7mm;
}

h1{
  margin:0;
  font-size:28px;
  letter-spacing:3px;
}

.subtitle{
  margin-top:7px;
  color:#9BAEC2;
  font-size:12px;
}

.board{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6mm;
}

.card{
  background:#081525;
  border:1px solid rgba(141,219,255,.16);
  border-radius:12px;
  padding:5mm;
  min-height:78mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.track-number{
  color:#55B7FF;
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
}

.track-name{
  margin-top:4px;
  font-size:17px;
  font-weight:800;
  letter-spacing:.7px;
}

.track-qr{
  background:#fff;
  padding:7px;
  margin:4mm 0 3mm;
  border-radius:5px;
}

.track-qr canvas,
.track-qr img{
  display:block;
}

.instruction{
  color:#9BAEC2;
  font-size:9px;
  line-height:1.45;
}

.final-piece{
  width:100%;
  margin-top:4mm;
  padding-top:3mm;
  border-top:1px dashed rgba(141,219,255,.25);
}

.final-label{
  color:#8DDBFF;
  font-size:9px;
  font-weight:bold;
  letter-spacing:1.2px;
  margin-bottom:2mm;
}

.piece{
  width:34mm;
  height:34mm;
  background:#fff;
  border:2px dashed #1687FF;
  margin:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.piece canvas{
  display:block;
  width:100% !important;
  height:100% !important;
  image-rendering:pixelated;
}

.no-final{
  margin-top:auto;
  padding-top:5mm;
  color:#66798d;
  font-size:8px;
  letter-spacing:.5px;
}

.print-button{
  display:block;
  margin:12px auto;
  padding:12px 24px;
  border:0;
  border-radius:8px;
  background:#1687FF;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

@media print{

  body{
    background:white;
  }

  .page{
    margin:0;
  }

  .print-button{
    display:none;
  }

  .card{
    break-inside:avoid;
  }
}
</style>
</head>

<body>

<button class="print-button" onclick="window.print()">
PRINT / SAVE PDF
</button>

<div class="page">

<header>
  <h1>SPARK</h1>

  <div class="subtitle">
    8 Tracks · 8 Challenges · 6 Final Pieces · 1 Final QR
  </div>
</header>

<div class="board" id="board"></div>

</div>


<script>

const BASE_URL =
"https://mazenelshebly.github.io/spark-community/";


/*
==================================================
TRACKS
==================================================

final:true
= participates in the Final QR

final:false
= normal challenge only
*/

const tracks = [

  {
    id:"web",
    name:"WEB DEVELOPMENT",
    file:"web.html",
    final:true
  },

  {
    id:"data",
    name:"DATA ANALYSIS",
    file:"data.html",
    final:true
  },

  {
    id:"cyber",
    name:"CYBER SECURITY",
    file:"cyber.html",
    final:true
  },

  {
    id:"bioinformatics",
    name:"BIOINFORMATICS",
    file:"bioinformatics.html",
    final:true
  },

  {
    id:"marketing",
    name:"MARKETING",
    file:"marketing.html",
    final:false
  },

  {
    id:"hr",
    name:"HR",
    file:"hr.html",
    final:true
  },

  {
    id:"logistics",
    name:"LOGISTICS",
    file:"logistics.html",
    final:true
  },

  {
    id:"general-skills",
    name:"GENERAL SKILLS",
    file:"general-skills.html",
    final:false
  }

];


/*
==================================================
CREATE 8 CARDS
==================================================
*/

const board =
document.getElementById("board");


tracks.forEach((track,index)=>{

  const card =
  document.createElement("div");

  card.className="card";

  const number =
  String(index+1).padStart(2,"0");


  card.innerHTML = `

    <div class="track-number">
      TRACK ${number}
    </div>

    <div class="track-name">
      ${track.name}
    </div>

    <div
      class="track-qr"
      id="qr-${track.id}">
    </div>

    <div class="instruction">
      SCAN THIS QR<br>
      OPEN THE CHALLENGE<br>
      SOLVE IT
    </div>

    ${
      track.final

      ?

      `
      <div class="final-piece">

        <div class="final-label">
          FINAL QR PIECE
        </div>

        <div
          class="piece"
          id="piece-${track.id}">
        </div>

      </div>
      `

      :

      `
      <div class="no-final">
        CHALLENGE ONLY<br>
        NOT PART OF FINAL QR
      </div>
      `
    }

  `;


  board.appendChild(card);


  /*
  Track QR
  */

  new QRCode(
    document.getElementById(
      `qr-${track.id}`
    ),
    {
      text:BASE_URL + track.file,

      width:145,
      height:145,

      colorDark:"#000000",
      colorLight:"#ffffff",

      correctLevel:
        QRCode.CorrectLevel.H
    }
  );

});


/*
==================================================
FINAL QR
==================================================

The six participating tracks receive
one piece each.

Final arrangement:

01 | 02 | 03
04 | 05 | 06

Final destination:
final-reveal.html
*/

const finalUrl =
BASE_URL + "final-reveal.html";


/*
Create hidden master QR.
*/

const hiddenQR =
document.createElement("div");

hiddenQR.style.position="fixed";
hiddenQR.style.left="-10000px";
hiddenQR.style.top="-10000px";

document.body.appendChild(hiddenQR);


const MASTER_SIZE=900;


new QRCode(
  hiddenQR,
  {
    text:finalUrl,

    width:MASTER_SIZE,
    height:MASTER_SIZE,

    colorDark:"#000000",
    colorLight:"#ffffff",

    correctLevel:
      QRCode.CorrectLevel.H
  }
);


/*
==================================================
WAIT FOR QR TO EXIST
==================================================
*/

function createFinalPieces(){

  const canvas =
    hiddenQR.querySelector("canvas");

  const image =
    hiddenQR.querySelector("img");


  /*
  QRCode.js can produce canvas OR image.
  */

  let source = null;


  if(canvas){

    source=canvas;

  }

  else if(
    image &&
    image.complete &&
    image.naturalWidth>0
  ){

    source=image;

  }


  /*
  If QR isn't ready yet,
  try again.
  */

  if(!source){

    setTimeout(
      createFinalPieces,
      100
    );

    return;
  }


  /*
  Create master canvas.
  */

  const master =
    document.createElement("canvas");

  master.width=MASTER_SIZE;
  master.height=MASTER_SIZE;


  const ctx =
    master.getContext("2d");


  ctx.imageSmoothingEnabled=false;


  /*
  White background.
  */

  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    0,
    0,
    MASTER_SIZE,
    MASTER_SIZE
  );


  /*
  Draw complete Final QR.
  */

  ctx.drawImage(
    source,
    0,
    0,
    MASTER_SIZE,
    MASTER_SIZE
  );


  /*
  Six participating tracks.
  */

  const finalTracks =
    tracks.filter(
      track=>track.final
    );


  /*
  Each piece is:

  300 × 450

  because the QR is divided into:

  3 columns
  2 rows
  */

  const pieceWidth =
    MASTER_SIZE/3;

  const pieceHeight =
    MASTER_SIZE/2;


  finalTracks.forEach(
    (track,index)=>{


      const target =
        document.getElementById(
          `piece-${track.id}`
        );


      if(!target)return;


      /*
      Position:

      0 = top-left
      1 = top-middle
      2 = top-right
      3 = bottom-left
      4 = bottom-middle
      5 = bottom-right
      */

      const column =
        index%3;

      const row =
        Math.floor(index/3);


      /*
      Piece canvas.
      */

      const pieceCanvas =
        document.createElement("canvas");


      pieceCanvas.width=
        pieceWidth;

      pieceCanvas.height=
        pieceHeight;


      const pieceCtx =
        pieceCanvas.getContext("2d");


      pieceCtx.imageSmoothingEnabled=false;


      /*
      Copy exact section
      from the master QR.
      */

      pieceCtx.drawImage(

        master,

        column*pieceWidth,
        row*pieceHeight,

        pieceWidth,
        pieceHeight,

        0,
        0,

        pieceWidth,
        pieceHeight

      );


      /*
      Put the piece into the card.
      */

      target.innerHTML="";

      target.appendChild(
        pieceCanvas
      );

    }
  );


  /*
  Remove hidden QR.
  */

  hiddenQR.remove();

}


/*
Start after page has loaded.
*/

window.addEventListener(
  "load",
  ()=>{
    setTimeout(
      createFinalPieces,
      500
    );
  }
);

</script>

</body>
</html>
