<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK — QR Challenge Board</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050A12;
  color:#F5FAFF;
  font-family:Arial,Helvetica,sans-serif;
}

.page{
  width:210mm;
  min-height:297mm;
  margin:auto;
  padding:10mm;
}

header{
  text-align:center;
  margin-bottom:8mm;
}

h1{
  margin:0;
  font-size:28px;
  letter-spacing:3px;
}

.subtitle{
  margin-top:8px;
  color:#9BAEC2;
  font-size:13px;
}

.board{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7mm;
}

.card{
  background:#081525;
  border:1px solid rgba(141,219,255,.16);
  border-radius:14px;
  padding:7mm;
  min-height:82mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}

.track-number{
  color:#55B7FF;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}

.track-name{
  margin-top:4px;
  font-size:18px;
  font-weight:800;
  letter-spacing:1px;
}

.qr{
  background:white;
  padding:8px;
  margin:6mm 0 4mm;
  border-radius:5px;
}

.qr img,
.qr canvas{
  display:block;
}

.instruction{
  color:#9BAEC2;
  font-size:10px;
  line-height:1.5;
  max-width:230px;
}

.final-piece{
  margin-top:5mm;
  padding-top:4mm;
  border-top:1px dashed rgba(141,219,255,.25);
  width:100%;
}

.final-title{
  color:#8DDBFF;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:3mm;
}

.final-box{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:35mm;
  height:35mm;
  background:white;
  border:2px dashed #1687FF;
  color:#1687FF;
  font-size:9px;
  font-weight:bold;
}

.no-final{
  margin-top:auto;
  padding-top:5mm;
  color:#66798d;
  font-size:9px;
  letter-spacing:.5px;
}

button{
  display:block;
  margin:10mm auto;
  padding:13px 25px;
  border:0;
  border-radius:8px;
  background:#1687FF;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

@media print{
  body{
    background:white;
  }

  .page{
    margin:0;
    width:210mm;
    min-height:297mm;
  }

  button{
    display:none;
  }

  .card{
    break-inside:avoid;
  }
}
</style>
</head>

<body>

<button onclick="window.print()">PRINT / SAVE PDF</button>

<div class="page">

<header>
  <h1>SPARK</h1>
  <div class="subtitle">
    8 Tracks · 8 Challenges · 6 Final Pieces · 1 Final QR
  </div>
</header>

<div class="board" id="board"></div>

</div>

<script>

const BASE_URL =
"https://mazenelshebly.github.io/spark-community/";

const tracks = [

  {
    id:"web",
    name:"WEB DEVELOPMENT",
    url:"web.html",
    final:true
  },

  {
    id:"data",
    name:"DATA ANALYSIS",
    url:"data.html",
    final:true
  },

  {
    id:"cyber",
    name:"CYBER SECURITY",
    url:"cyber.html",
    final:true
  },

  {
    id:"bioinformatics",
    name:"BIOINFORMATICS",
    url:"bioinformatics.html",
    final:true
  },

  {
    id:"marketing",
    name:"MARKETING",
    url:"marketing.html",
    final:false
  },

  {
    id:"hr",
    name:"HR",
    url:"hr.html",
    final:true
  },

  {
    id:"logistics",
    name:"LOGISTICS",
    url:"logistics.html",
    final:true
  },

  {
    id:"general-skills",
    name:"GENERAL SKILLS",
    url:"general-skills.html",
    final:false
  }

];

const board = document.getElementById("board");

/*
  Final QR destination.
  The six final pieces represent ONE QR:
  
  01 | 02 | 03
  04 | 05 | 06
*/

const finalUrl =
BASE_URL + "final-reveal.html";


// Create cards
tracks.forEach((track,index)=>{

  const card = document.createElement("div");
  card.className = "card";

  const number =
    String(index + 1).padStart(2,"0");

  card.innerHTML = `
    <div class="track-number">
      TRACK ${number}
    </div>

    <div class="track-name">
      ${track.name}
    </div>

    <div class="qr" id="qr-${track.id}"></div>

    <div class="instruction">
      SCAN THIS QR<br>
      OPEN THE CHALLENGE<br>
      SOLVE IT
    </div>

    ${
      track.final
      ?
      `
      <div class="final-piece">

        <div class="final-title">
          FINAL QR PIECE
        </div>

        <div
          class="final-box"
          id="piece-${track.id}">
          PIECE
        </div>

      </div>
      `
      :
      `
      <div class="no-final">
        CHALLENGE ONLY<br>
        NOT PART OF FINAL QR
      </div>
      `
    }

  `;

  board.appendChild(card);


  // Generate complete Track QR
  new QRCode(
    document.getElementById(`qr-${track.id}`),
    {
      text:BASE_URL + track.url,
      width:150,
      height:150,
      correctLevel:QRCode.CorrectLevel.H
    }
  );

});


// --------------------------------------------------
// FINAL QR PIECES
// --------------------------------------------------

/*
  We create one large final QR image and divide it
  into six visual pieces.

  The pieces are assigned ONLY to the six final tracks.
*/

const finalCanvas = document.createElement("canvas");

const FINAL_SIZE = 900;

finalCanvas.width = FINAL_SIZE;
finalCanvas.height = FINAL_SIZE;

const finalQRContainer =
document.createElement("div");

finalQRContainer.style.position="absolute";
finalQRContainer.style.left="-99999px";

document.body.appendChild(finalQRContainer);

new QRCode(
  finalQRContainer,
  {
    text:finalUrl,
    width:FINAL_SIZE,
    height:FINAL_SIZE,
    correctLevel:QRCode.CorrectLevel.H
  }
);


// Wait until QR image is generated
setTimeout(()=>{

  const img =
    finalQRContainer.querySelector("img");

  if(!img){
    console.error("Final QR image not generated.");
    return;
  }

  const ctx =
    finalCanvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.fillRect(
    0,
    0,
    FINAL_SIZE,
    FINAL_SIZE
  );

  ctx.drawImage(
    img,
    0,
    0,
    FINAL_SIZE,
    FINAL_SIZE
  );


  /*
    3 columns × 2 rows
  */

  const pieceSize = FINAL_SIZE / 3;

  const finalTracks =
  tracks.filter(t=>t.final);

  finalTracks.forEach((track,i)=>{

    const piece =
      document.getElementById(
        `piece-${track.id}`
      );

    if(!piece) return;

    const col = i % 3;
    const row = Math.floor(i / 3);

    const pieceCanvas =
      document.createElement("canvas");

    pieceCanvas.width = pieceSize;
    pieceCanvas.height = pieceSize;

    const pieceCtx =
      pieceCanvas.getContext("2d");

    pieceCtx.drawImage(
      finalCanvas,

      col * pieceSize,
      row * pieceSize,
      pieceSize,
      pieceSize,

      0,
      0,
      pieceSize,
      pieceSize
    );


    const pieceImg =
      document.createElement("img");

    pieceImg.src =
      pieceCanvas.toDataURL("image/png");

    pieceImg.style.width="35mm";
    pieceImg.style.height="35mm";
    pieceImg.style.display="block";

    piece.innerHTML="";
    piece.appendChild(pieceImg);

  });


  finalQRContainer.remove();

},500);

</script>

</body>
</html>
