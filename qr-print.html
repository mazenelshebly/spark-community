<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARK — QR Print Board</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080d15;
  color:#f5faff;
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   CONTROL BAR
========================= */

.controls{
  position:sticky;
  top:0;
  z-index:100;
  background:#050a12;
  border-bottom:1px solid rgba(85,183,255,.2);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.controls h1{
  font-size:16px;
  letter-spacing:2px;
}

.controls p{
  color:#8fa5ba;
  font-size:12px;
  margin-top:4px;
}

.print-btn{
  border:0;
  background:#1687ff;
  color:white;
  padding:12px 22px;
  border-radius:8px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
}

.print-btn:hover{
  background:#55b7ff;
}

/* =========================
   A4 PRINT AREA
========================= */

.sheet{
  width:210mm;
  min-height:297mm;
  margin:25px auto;
  padding:7mm;

  background:#050a12;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);

  gap:3mm;
}

/* =========================
   CARD
========================= */

.card{
  position:relative;
  overflow:hidden;

  border:1px solid rgba(85,183,255,.28);
  border-radius:4px;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(22,135,255,.13),
      transparent 55%
    ),
    #081525;

  padding:4mm;

  display:flex;
  flex-direction:column;
  align-items:center;

  min-width:0;
}

/* subtle technical lines */

.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      transparent 49.5%,
      rgba(141,219,255,.035) 50%,
      transparent 50.5%
    ),
    linear-gradient(
      transparent 49.5%,
      rgba(141,219,255,.035) 50%,
      transparent 50.5%
    );
  pointer-events:none;
}

/* =========================
   CARD HEADER
========================= */

.card-number{
  align-self:flex-start;

  font-size:8px;
  font-weight:900;
  color:#55b7ff;

  letter-spacing:2px;
}

.track-name{
  margin-top:2mm;

  font-size:10px;
  font-weight:900;

  letter-spacing:1px;
  text-align:center;

  color:#f5faff;
}

.track-sub{
  margin-top:1mm;

  font-size:6px;
  letter-spacing:1px;

  color:#8fa5ba;
}

/* =========================
   SMALL QR
========================= */

.challenge-label{
  margin-top:3mm;

  font-size:5px;
  font-weight:800;

  letter-spacing:1.3px;
  color:#55b7ff;
}

.challenge-qr{
  width:22mm;
  height:22mm;

  background:white;

  margin-top:1.5mm;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:1mm;
}

.challenge-qr canvas,
.challenge-qr img{
  width:100% !important;
  height:100% !important;
}

/* =========================
   FINAL QR TILE
========================= */

.final-label{
  margin-top:auto;

  font-size:5px;
  font-weight:800;

  letter-spacing:1.2px;

  color:#55b7ff;
}

.final-tile{
  width:31mm;
  height:31mm;

  background:white;

  margin-top:1.5mm;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;
}

.final-tile canvas,
.final-tile img{
  width:100%;
  height:100%;
  display:block;
}

.tile-number{
  margin-top:1mm;

  font-size:5px;
  font-weight:900;

  letter-spacing:1px;

  color:#9db3c8;
}

/* =========================
   PRINT INFO
========================= */

.info{
  position:absolute;

  bottom:2mm;
  left:0;
  right:0;

  text-align:center;

  font-size:4px;
  letter-spacing:.7px;

  color:#60758a;
}

/* =========================
   SCREEN ONLY
========================= */

@media screen and (max-width:900px){

  .sheet{
    transform-origin:top center;
    margin:15px auto;
  }

  .controls{
    position:relative;
  }
}

/* =========================
   PRINT
========================= */

@media print{

  @page{
    size:A4 portrait;
    margin:0;
  }

  body{
    background:white;
  }

  .controls{
    display:none;
  }

  .sheet{
    margin:0;
    width:210mm;
    height:297mm;
    min-height:297mm;

    padding:7mm;

    background:#050a12;

    gap:3mm;

    page-break-after:avoid;
  }

  .card{
    break-inside:avoid;
  }
}
</style>
</head>

<body>

<!-- =========================
     CONTROL BAR
========================= -->

<div class="controls">

  <div>
    <h1>SPARK — QR PRINT BOARD</h1>
    <p>8 Tracks · 8 Challenges · 1 Final QR</p>
  </div>

  <button class="print-btn" onclick="window.print()">
    PRINT / SAVE PDF
  </button>

</div>


<!-- =========================
     PRINT SHEET
========================= -->

<div class="sheet" id="sheet"></div>


<script>

/* ==========================================
   BASIC SETTINGS
========================================== */

const BASE_URL =
"https://mazenelshebly.github.io/spark-community/";

const FINAL_URL =
BASE_URL + "final-reveal.html";


/* ==========================================
   TRACK DATA
========================================== */

const tracks = [

  {
    number:"01",
    name:"WEB DEVELOPMENT",
    short:"WEB",
    url:BASE_URL+"web.html"
  },

  {
    number:"02",
    name:"DATA ANALYSIS",
    short:"DATA",
    url:BASE_URL+"data.html"
  },

  {
    number:"03",
    name:"CYBER SECURITY",
    short:"CYBER",
    url:BASE_URL+"cyber.html"
  },

  {
    number:"04",
    name:"BIOINFORMATICS",
    short:"BIOINFORMATICS",
    url:BASE_URL+"bioinformatics.html"
  },

  {
    number:"05",
    name:"MARKETING",
    short:"MARKETING",
    url:BASE_URL+"marketing.html"
  },

  {
    number:"06",
    name:"HR",
    short:"HR",
    url:BASE_URL+"hr.html"
  },

  {
    number:"07",
    name:"LOGISTICS",
    short:"LOGISTICS",
    url:BASE_URL+"logistics.html"
  },

  {
    number:"08",
    name:"GENERAL SKILLS",
    short:"GENERAL SKILLS",
    url:BASE_URL+"general-skills.html"
  }

];


/* ==========================================
   CREATE FINAL QR
========================================== */

const finalQRHolder = document.createElement("div");

finalQRHolder.style.position = "absolute";
finalQRHolder.style.left = "-99999px";
finalQRHolder.style.top = "0";

document.body.appendChild(finalQRHolder);


/*
   Large QR.
   1000 × 1000 gives enough resolution
   for the 8 physical pieces.
*/

new QRCode(finalQRHolder,{
  text:FINAL_URL,

  width:1000,
  height:1000,

  colorDark:"#000000",
  colorLight:"#ffffff",

  correctLevel:QRCode.CorrectLevel.H
});


/* ==========================================
   WAIT FOR QR GENERATION
========================================== */

setTimeout(() => {

  const qrCanvas =
    finalQRHolder.querySelector("canvas");

  const qrImage =
    finalQRHolder.querySelector("img");


  let sourceCanvas =
    document.createElement("canvas");

  sourceCanvas.width=1000;
  sourceCanvas.height=1000;

  let ctx =
    sourceCanvas.getContext("2d");


  /*
     If QRCode.js generated a canvas,
     use it directly.
  */

  if(qrCanvas){

    ctx.drawImage(
      qrCanvas,
      0,
      0,
      1000,
      1000
    );

    buildCards(sourceCanvas);

  }


  /*
     Fallback if QRCode.js generated an image.
  */

  else if(qrImage){

    const img = new Image();

    img.onload = () => {

      ctx.drawImage(
        img,
        0,
        0,
        1000,
        1000
      );

      buildCards(sourceCanvas);

    };

    img.src = qrImage.src;

  }

},800);


/* ==========================================
   BUILD 8 CARDS
========================================== */

function buildCards(finalCanvas){

  const sheet =
    document.getElementById("sheet");


  /*
     Final QR arrangement:

     01 | 02 | 03 | 04
     05 | 06 | 07 | 08

     Each tile is exactly 1/4 width
     and 1/2 height of the full QR.
  */

  const tileWidth = 250;
  const tileHeight = 500;


  tracks.forEach((track,index)=>{

    const card =
      document.createElement("div");

    card.className="card";


    /* ======================================
       CARD HEADER
    ====================================== */

    const number =
      document.createElement("div");

    number.className="card-number";

    number.textContent =
      "PIECE " + track.number;


    const name =
      document.createElement("div");

    name.className="track-name";

    name.textContent =
      track.name;


    const sub =
      document.createElement("div");

    sub.className="track-sub";

    sub.textContent =
      "TRACK CHALLENGE";


    /* ======================================
       SMALL CHALLENGE QR
    ====================================== */

    const challengeLabel =
      document.createElement("div");

    challengeLabel.className =
      "challenge-label";

    challengeLabel.textContent =
      "SCAN TO DISCOVER YOUR CLUE";


    const challengeQR =
      document.createElement("div");

    challengeQR.className =
      "challenge-qr";


    new QRCode(challengeQR,{

      text:track.url,

      width:180,
      height:180,

      colorDark:"#000000",
      colorLight:"#ffffff",

      correctLevel:
        QRCode.CorrectLevel.M

    });


    /* ======================================
       FINAL QR TILE
    ====================================== */

    const finalLabel =
      document.createElement("div");

    finalLabel.className =
      "final-label";

    finalLabel.textContent =
      "FINAL QR — PIECE " + track.number;


    const finalTile =
      document.createElement("div");

    finalTile.className =
      "final-tile";


    /*
       Determine tile coordinates.

       index:
       0 1 2 3
       4 5 6 7
    */

    const col =
      index % 4;

    const row =
      Math.floor(index / 4);


    const tileCanvas =
      document.createElement("canvas");

    tileCanvas.width =
      tileWidth;

    tileCanvas.height =
      tileHeight;


    const tileCtx =
      tileCanvas.getContext("2d");


    tileCtx.drawImage(

      finalCanvas,

      col * tileWidth,
      row * tileHeight,

      tileWidth,
      tileHeight,

      0,
      0,

      tileWidth,
      tileHeight

    );


    finalTile.appendChild(tileCanvas);


    /* ======================================
       TILE NUMBER
    ====================================== */

    const tileNumber =
      document.createElement("div");

    tileNumber.className =
      "tile-number";

    tileNumber.textContent =
      "ASSEMBLE 01 → 08";


    /* ======================================
       INFO
    ====================================== */

    const info =
      document.createElement("div");

    info.className="info";

    info.textContent =
      "BCU-Obour Branch · SPARK";


    /* ======================================
       ADD EVERYTHING
    ====================================== */

    card.appendChild(number);
    card.appendChild(name);
    card.appendChild(sub);

    card.appendChild(challengeLabel);
    card.appendChild(challengeQR);

    card.appendChild(finalLabel);
    card.appendChild(finalTile);

    card.appendChild(tileNumber);
    card.appendChild(info);

    sheet.appendChild(card);

  });

}


/* ==========================================
   REMOVE GENERATOR AFTER USE
========================================== */

setTimeout(()=>{

  if(finalQRHolder){
    finalQRHolder.remove();
  }

},3000);

</script>

</body>
</html>
